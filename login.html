
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Grow Up</title>
    <style>
body {
    font-family: Arial;
    background-color: #f0f0f0;
    text-align: center;
    padding: 50px;
}

h1 {
    color: black;
}

h2 {
    color: gray;
}

form {
    background-color: white;
    width: 300px;
    margin-left: auto;
    margin-right: auto;
    padding: 20px;
    border: 1px solid black;
}

label {
    display: block;
    text-align: left;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 5px;
    margin-bottom: 10px;
    border: 1px solid gray;
}

button {
    width: 100%;
    padding: 10px;
    background-color: black;
    color: white;
    border: none;
}

p {
    margin-top: 20px;
}

a {
    color: blue;
}

.logo {
    width: 150px;
    height: auto;
} 
</style>
</head>
<body>

    <img src="logo.png" alt="Grow Up" class="logo">
    <h2>Connectez-vous</h2>

    <form action="store.html">
        <label>Email :</label><br>
        <input type="email" required><br><br>

        <label>Mot de passe :</label><br>
        <input type="password" required><br><br>

        <button type="submit">Se connecter</button>
    </form>

    <br>

    <p>
        <a href="store.html">Vous n'avez pas de compte ?</a>
    </p>

</body>
</html>
